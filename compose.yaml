services:
  stock-db:
    image: postgres:17-alpine
    container_name: korp-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STOCK_DB_NAME}
      POSTGRES_USER: ${STOCK_DB_USER}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD}
    ports:
      - "${STOCK_DB_PORT}:5432"
    volumes:
      - stock-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STOCK_DB_USER} -d ${STOCK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stock-db-data:
